name: docker-ml-app
services:
  api:
    build:
      context: /home/bledyx/UA/master-ia/AIIA/docker-practice/docker-ml-app/api
      dockerfile: Dockerfile
    container_name: api
    deploy:
      resources:
        limits:
          memory: "4294967296"
    environment:
      TORCH_HOME: /opt/torch-cache
    image: myapi:cpu
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8000
        published: "8000"
        protocol: tcp
    shm_size: "1073741824"
  ui:
    build:
      context: /home/bledyx/UA/master-ia/AIIA/docker-practice/docker-ml-app/ui
      dockerfile: Dockerfile
    container_name: ui
    depends_on:
      api:
        condition: service_healthy
        required: true
    environment:
      API_URL: http://api:8000
      GRADIO_ANALYTICS_ENABLED: "false"
    image: myui
    networks:
      default: null
    ports:
      - mode: ingress
        target: 7860
        published: "7860"
        protocol: tcp
networks:
  default:
    name: docker-ml-app_default
    driver: bridge
